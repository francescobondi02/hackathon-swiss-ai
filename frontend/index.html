<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Number</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 2rem; }
      button { padding: 0.6rem 1rem; font-size: 1rem; cursor: pointer; }
      .value { margin-top: 1rem; font-size: 1.25rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [value, setValue] = useState(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState(null);

        const fetchRandom = async () => {
          setLoading(true); setError(null);
          try {
            const res = await fetch('http://127.0.0.1:8000/api/random');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            setValue(data.value);
          } catch (err) {
            setError(err.message || 'Request failed');
          } finally {
            setLoading(false);
          }
        };

        return (
          <div>
            <h1>Random Number</h1>
            <button onClick={fetchRandom} disabled={loading}>
              {loading ? 'Loading...' : 'Get Random Number'}
            </button>
            <div className="value">
              {error && <span style={{color: 'crimson'}}>Error: {error}</span>}
              {!error && value !== null && <span>Value: <strong>{value}</strong></span>}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
